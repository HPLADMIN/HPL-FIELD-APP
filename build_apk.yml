name: Build Release APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-Create Native App & Build APK
        run: |
          # 1. Cloud me fresh Flutter project banayega
          flutter create --org com.hplinfra hpl_field_app
          cd hpl_field_app

          # 2. Plugins add karega
          flutter pub add http geolocator image_picker sqflite path_provider shared_preferences intl

          # 3. Android Permissions inject karega
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n<uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

          # 4. Pure Native Offline Dart Code inject karega
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:http/http.dart' as http;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:intl/intl.dart';
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart' as p;

          const String API_URL = "https://hplinfra.com/erp/api/field_app_api.php";

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: HplNativeHome(),
            ));
          }

          class HplNativeHome extends StatefulWidget {
            const HplNativeHome({super.key});
            @override
            State<HplNativeHome> createState() => _HplNativeHomeState();
          }

          class _HplNativeHomeState extends State<HplNativeHome> {
            int currentTab = 0;
            bool isDutyActive = false;
            Position? currentGps;
            int offlinePoints = 0;
            List<dynamic> tasks = [];
            Database? localDb;

            @override
            void initState() {
              super.initState();
              _initDatabaseAndGps();
              _loadTasks();
            }

            void _initDatabaseAndGps() async {
              localDb = await openDatabase(
                p.join(await getDatabasesPath(), 'hpl_offline_app.db'),
                version: 1,
                onCreate: (db, v) async {
                  await db.execute('CREATE TABLE routes (id INTEGER PRIMARY KEY, lat TEXT, lng TEXT, log_time TEXT, synced INTEGER)');
                },
              );

              await Geolocator.requestPermission();
              Timer.periodic(const Duration(minutes: 2), (t) async {
                try {
                  Position pos = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
                  setState(() => currentGps = pos);
                  if (localDb != null) {
                    await localDb!.insert('routes', {
                      'lat': pos.latitude.toString(),
                      'lng': pos.longitude.toString(),
                      'log_time': DateFormat('HH:mm:ss').format(DateTime.now()),
                      'synced': 0
                    });
                    var count = Sqflite.firstIntValue(await localDb!.rawQuery('SELECT COUNT(*) FROM routes WHERE synced=0')) ?? 0;
                    setState(() => offlinePoints = count);
                  }
                  _autoSyncOffline();
                } catch (_) {}
              });
            }

            void _autoSyncOffline() async {
              if (localDb == null) return;
              var unsynced = await localDb!.query('routes', where: 'synced=0', limit: 30);
              if (unsynced.isEmpty) return;

              try {
                var res = await http.post(
                  Uri.parse("$API_URL?action=sync_offline_route"),
                  headers: {"Content-Type": "application/json"},
                  body: jsonEncode({"user_id": 1, "route_points": unsynced}),
                );
                if (res.statusCode == 200) {
                  await localDb!.update('routes', {'synced': 1}, where: 'synced=0');
                  setState(() => offlinePoints = 0);
                }
              } catch (_) {}
            }

            void _loadTasks() async {
              try {
                var res = await http.get(Uri.parse("$API_URL?action=get_my_tasks&user_id=1"));
                if (res.statusCode == 200) {
                  var data = jsonDecode(res.body);
                  if (data['status'] == true) setState(() => tasks = data['tasks']);
                }
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF1F5F9),
                appBar: AppBar(
                  title: const Text("HPL Field Force App", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                  backgroundColor: const Color(0xFF0F172A),
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(icon: const Icon(Icons.sync), onPressed: _autoSyncOffline)
                  ],
                ),
                body: currentTab == 0 ? _buildDutyView() : _buildTaskView(),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: currentTab,
                  onTap: (i) => setState(() => currentTab = i),
                  selectedItemColor: const Color(0xFF2563EB),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.location_on), label: "Duty & GPS"),
                    BottomNavigationBarItem(icon: Icon(Icons.assignment), label: "My Tasks"),
                  ],
                ),
              );
            }

            Widget _buildDutyView() {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  Card(
                    color: offlinePoints > 0 ? Colors.orange.shade50 : Colors.green.shade50,
                    child: Padding(
                      padding: const EdgeInsets.all(12),
                      child: Row(
                        children: [
                          Icon(offlinePoints > 0 ? Icons.cloud_off : Icons.cloud_done, color: offlinePoints > 0 ? Colors.orange : Colors.green),
                          const SizedBox(width: 10),
                          Expanded(child: Text(offlinePoints > 0 ? "$offlinePoints Route Points saved in Offline SQLite" : "GPS Satellite Active & Synced", style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12))),
                        ],
                      ),
                    ),
                  ),
                  const SizedBox(height: 12),
                  Card(
                    child: Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text("LIVE HARDWARE GPS (NO INTERNET NEEDED)", style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold, color: Colors.grey)),
                          const SizedBox(height: 6),
                          Text(currentGps != null ? "${currentGps!.latitude.toStringAsFixed(6)}, ${currentGps!.longitude.toStringAsFixed(6)}" : "Locking Satellite Coordinates...", style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ),
                  ),
                  const SizedBox(height: 20),
                  ElevatedButton.icon(
                    onPressed: () {
                      setState(() => isDutyActive = !isDutyActive);
                      ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(isDutyActive ? "Duty Started! Start Point Locked." : "Duty Ended! End Point Locked.")));
                    },
                    icon: Icon(isDutyActive ? Icons.stop : Icons.play_arrow),
                    label: Text(isDutyActive ? "PUNCH OUT (End Day)" : "PUNCH IN (Start Day)"),
                    style: ElevatedButton.styleFrom(
                      backgroundColor: isDutyActive ? Colors.red : Colors.green,
                      foregroundColor: Colors.white,
                      padding: const EdgeInsets.symmetric(vertical: 14),
                    ),
                  ),
                ],
              );
            }

            Widget _buildTaskView() {
              if (tasks.isEmpty) return const Center(child: Text("No tasks assigned by MIS coordinator."));
              return ListView.builder(
                padding: const EdgeInsets.all(14),
                itemCount: tasks.length,
                itemBuilder: (ctx, i) {
                  var t = tasks[i];
                  return Card(
                    child: ListTile(
                      title: Text(t['gp_name'] ?? 'Site', style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: Text("${t['block_name']} • Due: ${t['target_date']}"),
                      trailing: const Icon(Icons.arrow_forward_ios, size: 16),
                    ),
                  );
                },
              );
            }
          }
          EOF

          # 5. Build Release APK in Cloud
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: HPL-Field-App-APK
          path: hpl_field_app/build/app/outputs/flutter-apk/app-release.apk
