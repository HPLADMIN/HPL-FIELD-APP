name: Build Release APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Final HPL Field App APK
        run: |
          flutter create --org com.hplinfra hpl_field_app
          cd hpl_field_app

          # Dependencies
          flutter pub add http geolocator image_picker shared_preferences intl

          # Permissions
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n<uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:http/http.dart' as http;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:intl/intl.dart';

          const String BASE_URL = "https://hplinfra.com/erp/api";

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: AppRoot()));
          }

          class AppRoot extends StatefulWidget {
            const AppRoot({super.key});
            @override
            State<AppRoot> createState() => _AppRootState();
          }

          class _AppRootState extends State<AppRoot> {
            bool isLoggedIn = false;
            int userId = 1;
            String userName = "Field Engineer";

            @override
            void initState() {
              super.initState();
              _checkAuth();
            }

            void _checkAuth() async {
              SharedPreferences p = await SharedPreferences.getInstance();
              setState(() {
                isLoggedIn = p.getBool('logged_in') ?? false;
                userId = p.getInt('user_id') ?? 1;
                userName = p.getString('user_name') ?? "Field Engineer";
              });
            }

            @override
            Widget build(BuildContext context) {
              return isLoggedIn 
                ? ProDashboard(userId: userId, userName: userName, onLogout: () {
                    setState(() => isLoggedIn = false);
                  })
                : LoginScreen(onLoginSuccess: (id, name) {
                    setState(() {
                      userId = id;
                      userName = name;
                      isLoggedIn = true;
                    });
                  });
            }
          }

          // LOGIN SCREEN
          class LoginScreen extends StatefulWidget {
            final Function(int, String) onLoginSuccess;
            const LoginScreen({super.key, required this.onLoginSuccess});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final emailCtrl = TextEditingController(text: "admin@erp.com");
            final passCtrl = TextEditingController(text: "admin123");
            bool loading = false;

            void login() async {
              setState(() => loading = true);
              try {
                var res = await http.post(
                  Uri.parse("$BASE_URL/app_sync.php?action=login"),
                  body: {'email': emailCtrl.text.trim(), 'password': passCtrl.text},
                );
                var j = jsonDecode(res.body);
                if (j['status'] == true) {
                  SharedPreferences p = await SharedPreferences.getInstance();
                  await p.setBool('logged_in', true);
                  await p.setInt('user_id', j['user']['id']);
                  await p.setString('user_name', j['user']['name']);
                  widget.onLoginSuccess(j['user']['id'], j['user']['name']);
                } else {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(j['message'] ?? "Login Failed!")));
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Error: $e")));
              }
              setState(() => loading = false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Card(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                      child: Padding(
                        padding: const EdgeInsets.all(24),
                        child: Column(
                          children: [
                            const Icon(Icons.engineering, size: 55, color: Colors.indigo),
                            const SizedBox(height: 10),
                            const Text("HPL Field Force Pro", style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                            const Text("Enterprise Telecom Rollout", style: TextStyle(fontSize: 12, color: Colors.grey)),
                            const SizedBox(height: 20),
                            TextField(controller: emailCtrl, decoration: const InputDecoration(labelText: "Email ID", border: OutlineInputBorder())),
                            const SizedBox(height: 12),
                            TextField(controller: passCtrl, obscureText: true, decoration: const InputDecoration(labelText: "Password", border: OutlineInputBorder())),
                            const SizedBox(height: 20),
                            SizedBox(
                              width: double.infinity,
                              height: 48,
                              child: ElevatedButton(
                                onPressed: loading ? null : login,
                                style: ElevatedButton.styleFrom(backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                                child: loading ? const CircularProgressIndicator(color: Colors.white) : const Text("SIGN IN TO WORK"),
                              ),
                            )
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // PRO DASHBOARD
          class ProDashboard extends StatefulWidget {
            final int userId;
            final String userName;
            final VoidCallback onLogout;
            const ProDashboard({super.key, required this.userId, required this.userName, required this.onLogout});
            @override
            State<ProDashboard> createState() => _ProDashboardState();
          }

          class _ProDashboardState extends State<ProDashboard> {
            int currentTab = 0;
            Position? currentGps;
            bool isPunchedIn = false;
            bool isDayCompleted = false;
            List<dynamic> myTasks = [];
            List<dynamic> filteredTasks = [];
            String selectedStageFilter = "All";
            Timer? offlineGpsTimer;
            int presentDays = 0, absentDays = 0, leavesCount = 0;

            @override
            void initState() {
              super.initState();
              _getGps();
              _checkPersistentAttendance();
              _fetchTasks();
              _fetchRealAttendance();
              _startOfflineGpsBreadcrumbs();
            }

            @override
            void dispose() {
              offlineGpsTimer?.cancel();
              super.dispose();
            }

            void _getGps() async {
              await Geolocator.requestPermission();
              Position pos = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
              setState(() => currentGps = pos);
            }

            // 1. PERSISTENT ATTENDANCE STATE (Stays 'DUTY ACTIVE' on Re-login)
            void _checkPersistentAttendance() async {
              SharedPreferences p = await SharedPreferences.getInstance();
              String today = DateFormat('yyyy-MM-dd').format(DateTime.now());
              if (p.getString('punch_date') == today && (p.getBool('punched_in') ?? false)) {
                setState(() => isPunchedIn = true);
              }

              try {
                var res = await http.get(Uri.parse("$BASE_URL/field_app_api.php?action=get_today_status&user_id=${widget.userId}"));
                var j = jsonDecode(res.body);
                if (j['status'] == true) {
                  setState(() {
                    isPunchedIn = j['is_punched_in'];
                    isDayCompleted = j['is_completed'];
                  });
                  await p.setBool('punched_in', isPunchedIn);
                  await p.setString('punch_date', today);
                }
              } catch (_) {}
            }

            // 2. OFFLINE BREADCRUMB GPS LOGGER (Logs every 5 min locally & auto-syncs)
            void _startOfflineGpsBreadcrumbs() {
              offlineGpsTimer = Timer.periodic(const Duration(minutes: 5), (t) async {
                try {
                  Position pos = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
                  SharedPreferences p = await SharedPreferences.getInstance();
                  List<String> route = p.getStringList('gps_route') ?? [];
                  route.add(jsonEncode({'lat': pos.latitude, 'lng': pos.longitude, 'time': DateFormat('HH:mm:ss').format(DateTime.now())}));
                  await p.setStringList('gps_route', route);

                  // Auto sync if network present
                  if (route.length >= 3) {
                    var pts = route.map((e) => jsonDecode(e)).toList();
                    var res = await http.post(
                      Uri.parse("$BASE_URL/field_app_api.php?action=sync_offline_route"),
                      headers: {"Content-Type": "application/json"},
                      body: jsonEncode({'user_id': widget.userId, 'route_points': pts}),
                    );
                    if (res.statusCode == 200) {
                      await p.remove('gps_route');
                    }
                  }
                } catch (_) {}
              });
            }

            void _punchInWithSelfie() async {
              final picker = ImagePicker();
              final picked = await picker.pickImage(source: ImageSource.camera, preferredCameraDevice: CameraDevice.front);
              if (picked == null) return;

              Position pos = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
              var req = http.MultipartRequest("POST", Uri.parse("$BASE_URL/field_app_api.php?action=punch_in"));
              req.fields['user_id'] = widget.userId.toString();
              req.fields['user_name'] = widget.userName;
              req.fields['latitude'] = pos.latitude.toString();
              req.fields['longitude'] = pos.longitude.toString();
              req.files.add(await http.MultipartFile.fromPath('selfie', picked.path));

              var res = await req.send();
              if (res.statusCode == 200) {
                SharedPreferences p = await SharedPreferences.getInstance();
                await p.setBool('punched_in', true);
                await p.setString('punch_date', DateFormat('yyyy-MM-dd').format(DateTime.now()));
                setState(() => isPunchedIn = true);
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("✓ Duty Active! Selfie stamped with GPS Lat/Long."), backgroundColor: Colors.green));
              }
            }

            void _punchOut() async {
              Position pos = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
              await http.post(Uri.parse("$BASE_URL/field_app_api.php?action=punch_out"), body: {
                'user_id': widget.userId.toString(),
                'latitude': pos.latitude.toString(),
                'longitude': pos.longitude.toString(),
              });
              SharedPreferences p = await SharedPreferences.getInstance();
              await p.setBool('punched_in', false);
              setState(() {
                isPunchedIn = false;
                isDayCompleted = true;
              });
              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("✓ Duty Ended (Punch-Out Done)!"), backgroundColor: Colors.blue));
            }

            void _fetchTasks() async {
              try {
                var res = await http.get(Uri.parse("$BASE_URL/field_app_api.php?action=get_my_tasks&user_id=${widget.userId}"));
                var j = jsonDecode(res.body);
                if (j['status'] == true) {
                  setState(() {
                    myTasks = j['tasks'];
                    _filterTasks("All");
                  });
                }
              } catch (_) {}
            }

            void _filterTasks(String stage) {
              setState(() {
                selectedStageFilter = stage;
                if (stage == "All") {
                  filteredTasks = myTasks;
                } else {
                  filteredTasks = myTasks.where((t) => (t['task_type'] ?? '').toString().contains(stage)).toList();
                }
              });
            }

            void _fetchRealAttendance() async {
              try {
                var res = await http.get(Uri.parse("$BASE_URL/field_app_api.php?action=get_monthly_attendance&user_id=${widget.userId}"));
                var j = jsonDecode(res.body);
                if (j['status'] == true) {
                  setState(() {
                    presentDays = j['present'];
                    absentDays = j['absent'];
                    leavesCount = j['leaves'];
                  });
                }
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF8FAFC),
                appBar: AppBar(
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(widget.userName, style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold)),
                      Text(currentGps != null ? "GPS: ${currentGps!.latitude.toStringAsFixed(4)}, ${currentGps!.longitude.toStringAsFixed(4)}" : "Locking GPS...", style: const TextStyle(fontSize: 11, color: Colors.white70)),
                    ],
                  ),
                  backgroundColor: const Color(0xFF0F172A),
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.logout),
                      onPressed: () async {
                        SharedPreferences p = await SharedPreferences.getInstance();
                        await p.clear();
                        widget.onLogout();
                      },
                    )
                  ],
                ),
                body: IndexedStack(
                  index: currentTab,
                  children: [
                    _buildDutyTab(),
                    _buildTasksTab(),
                    _buildCalendarTab(),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: currentTab,
                  onTap: (i) => setState(() => currentTab = i),
                  selectedItemColor: Colors.indigo,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.camera_front), label: "Selfie Duty"),
                    BottomNavigationBarItem(icon: Icon(Icons.assignment), label: "My Tasks"),
                    BottomNavigationBarItem(icon: Icon(Icons.calendar_month), label: "Attendance"),
                  ],
                ),
              );
            }

            Widget _buildDutyTab() {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  Card(
                    elevation: 2,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                    child: Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          Text(
                            isDayCompleted 
                              ? "TODAY'S DUTY COMPLETED ✓" 
                              : (isPunchedIn ? "DUTY ACTIVE (ON SITE)" : "DUTY NOT STARTED"),
                            style: TextStyle(fontWeight: FontWeight.bold, color: isPunchedIn ? Colors.green : (isDayCompleted ? Colors.blue : Colors.red)),
                          ),
                          const SizedBox(height: 12),
                          if (!isDayCompleted)
                            SizedBox(
                              width: double.infinity,
                              height: 52,
                              child: ElevatedButton.icon(
                                onPressed: isPunchedIn ? _punchOut : _punchInWithSelfie,
                                icon: Icon(isPunchedIn ? Icons.stop_circle : Icons.camera_alt),
                                label: Text(isPunchedIn ? "PUNCH OUT (END DUTY)" : "PUNCH IN (TAKE SELFIE)"),
                                style: ElevatedButton.styleFrom(backgroundColor: isPunchedIn ? Colors.red : Colors.green, foregroundColor: Colors.white),
                              ),
                            ),
                          const SizedBox(height: 8),
                          const Text("Selfie will be watermarked with GPS Lat/Long & Timestamp", style: TextStyle(fontSize: 10, color: Colors.grey)),
                        ],
                      ),
                    ),
                  ),
                ],
              );
            }

            Widget _buildTasksTab() {
              return Column(
                children: [
                  // Stage Filter Horizontal Bar
                  Container(
                    height: 50,
                    padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),
                    color: Colors.white,
                    child: ListView(
                      scrollDirection: Axis.horizontal,
                      children: ["All", "Stage 1", "Stage 2", "Stage 3", "Stage 4", "Stage 5", "Stage 6"].map((stg) {
                        bool sel = selectedStageFilter == stg;
                        return Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 4),
                          child: ChoiceChip(
                            label: Text(stg, style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold, color: sel ? Colors.white : Colors.black87)),
                            selected: sel,
                            selectedColor: Colors.indigo,
                            onSelected: (b) => _filterTasks(stg),
                          ),
                        );
                      }).toList(),
                    ),
                  ),
                  Expanded(
                    child: filteredTasks.isEmpty
                      ? const Center(child: Text("No tasks assigned under this stage."))
                      : ListView.builder(
                          padding: const EdgeInsets.all(12),
                          itemCount: filteredTasks.length,
                          itemBuilder: (ctx, i) {
                            var t = filteredTasks[i];
                            return Card(
                              elevation: 2,
                              margin: const EdgeInsets.only(bottom: 12),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                              child: Padding(
                                padding: const EdgeInsets.all(14),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    // Task Stage Badge
                                    Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3),
                                      decoration: BoxDecoration(color: Colors.indigo.shade50, borderRadius: BorderRadius.circular(6), border: Border.all(color: Colors.indigo.shade200)),
                                      child: Text(t['task_type'] ?? 'Execution Stage', style: const TextStyle(fontSize: 11, fontWeight: FontWeight.bold, color: Colors.indigo)),
                                    ),
                                    const SizedBox(height: 6),
                                    Text(t['gp_name'] ?? 'GP Site', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                                    Text("${t['district_name']} • ${t['block_name']} (${t['gp_code']}) • Target: ${t['target_date']}", style: const TextStyle(fontSize: 12, color: Colors.black54)),
                                    const SizedBox(height: 10),
                                    SizedBox(
                                      width: double.infinity,
                                      child: ElevatedButton.icon(
                                        style: ElevatedButton.styleFrom(backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                                        onPressed: () {
                                          Navigator.push(context, MaterialPageRoute(builder: (c) => StageExecutionScreen(
                                            taskId: int.tryParse(t['task_id']?.toString() ?? '0') ?? 0,
                                            gpId: int.tryParse(t['gp_id']?.toString() ?? '0') ?? 0,
                                            gpName: t['gp_name'] ?? 'Site',
                                            taskStage: t['task_type'] ?? 'Stage 1',
                                            userName: widget.userName,
                                          )));
                                        },
                                        icon: const Icon(Icons.camera_alt, size: 16),
                                        label: const Text("Open Stage Execution Form", style: TextStyle(fontSize: 13, fontWeight: FontWeight.bold)),
                                      ),
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        ),
                  ),
                ],
              );
            }

            Widget _buildCalendarTab() {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  Card(
                    child: Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text("Real Attendance Summary (This Month)", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                          const SizedBox(height: 12),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceAround,
                            children: [
                              Column(children: [Text("$presentDays", style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.green)), const Text("Present Days", style: TextStyle(fontSize: 11))]),
                              Column(children: [Text("$absentDays", style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.red)), const Text("Absent Days", style: TextStyle(fontSize: 11))]),
                              Column(children: [Text("$leavesCount", style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.blue)), const Text("Approved Leaves", style: TextStyle(fontSize: 11))]),
                            ],
                          )
                        ],
                      ),
                    ),
                  ),
                ],
              );
            }
          }

          // DYNAMIC STAGE-SPECIFIC EXECUTION SCREEN (Only shows fields for that specific stage!)
          class StageExecutionScreen extends StatefulWidget {
            final int taskId;
            final int gpId;
            final String gpName;
            final String taskStage;
            final String userName;
            const StageExecutionScreen({super.key, required this.taskId, required this.gpId, required this.gpName, required this.taskStage, required this.userName});
            @override
            State<StageExecutionScreen> createState() => _StageExecutionScreenState();
          }

          class _StageExecutionScreenState extends State<StageExecutionScreen> {
            final Map<String, TextEditingController> ctrls = {};
            final Map<String, File?> photos = {};
            final remarksCtrl = TextEditingController();
            bool saving = false;

            TextEditingController _getCtrl(String key) {
              ctrls.putIfAbsent(key, () => TextEditingController());
              return ctrls[key]!;
            }

            Future<void> _capture(String tag) async {
              final picker = ImagePicker();
              final picked = await picker.pickImage(source: ImageSource.camera, imageQuality: 82);
              if (picked != null) {
                setState(() => photos[tag] = File(picked.path));
              }
            }

            void _submit() async {
              setState(() => saving = true);
              Position pos = await Geolocator.getCurrentPosition(desiredAccuracy: LocationAccuracy.high);
              var req = http.MultipartRequest("POST", Uri.parse("$BASE_URL/app_sync.php?action=submit_stage_execution"));
              req.fields['task_id'] = widget.taskId.toString();
              req.fields['gp_id'] = widget.gpId.toString();
              req.fields['stage_type'] = widget.taskStage;
              req.fields['user_name'] = widget.userName;
              req.fields['latitude'] = pos.latitude.toString();
              req.fields['longitude'] = pos.longitude.toString();
              req.fields['remarks'] = remarksCtrl.text;

              ctrls.forEach((k, v) { req.fields[k] = v.text; });
              for (var entry in photos.entries) {
                if (entry.value != null) {
                  req.files.add(await http.MultipartFile.fromPath(entry.key, entry.value!.path));
                }
              }

              try {
                var res = await req.send();
                if (res.statusCode == 200) {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("✓ ${widget.taskStage} Evidence Saved with GPS Stamp!"), backgroundColor: Colors.green));
                  Navigator.pop(context);
                }
              } catch (_) {}
              setState(() => saving = false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(widget.gpName), backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                body: saving 
                  ? const Center(child: CircularProgressIndicator())
                  : ListView(
                      padding: const EdgeInsets.all(16),
                      children: [
                        Container(
                          padding: const EdgeInsets.all(10),
                          decoration: BoxDecoration(color: Colors.indigo.shade50, borderRadius: BorderRadius.circular(8)),
                          child: Text("Executing: ${widget.taskStage}", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.indigo)),
                        ),
                        const SizedBox(height: 14),

                        // STAGE 1: UNLOADING
                        if (widget.taskStage.contains('Stage 1') || widget.taskStage.contains('Unloading')) ...[
                          _photoTile('Unloaded_Material_Site', 'Unloaded Material at Site Photo *'),
                          _photoTile('Delivery_Challan_Copy', 'Delivery Challan / Transporter Bilty Photo *'),
                        ]
                        // STAGE 2: RACK & ACTIVE I&C
                        else if (widget.taskStage.contains('Stage 2') || widget.taskStage.contains('Rack')) ...[
                          _inputField('router_chassis_no', 'Router Chassis Serial No *'),
                          _inputField('rack_sn', 'Rack Serial No *'),
                          _inputField('ems_sn', 'EMS Serial No *'),
                          _inputField('hups_sn', 'HUPS Serial No *'),
                          _inputField('battery_sn', 'Battery Bank Serial No *'),
                          _photoTile('Upper_Rack_Compartment', 'Upper Rack Compartment Photo *'),
                          _photoTile('Lower_Rack_Compartment', 'Lower Rack Compartment Photo *'),
                          _photoTile('Band_Rack_Front', 'Band Rack (Closed) Photo *'),
                          _photoTile('Rack_Grouting_Base', 'Rack Grouting Base Foundation Photo *'),
                        ]
                        // STAGE 3: EARTHING
                        else if (widget.taskStage.contains('Stage 3') || widget.taskStage.contains('Earthing')) ...[
                          _photoTile('Earth_Electrode_Pit', 'Earthing Pit Photo *'),
                          _photoTile('Busbar_Termination_Strip', 'Copper Busbar & Strip Termination Photo *'),
                          _photoTile('Earthing_Meter_Ohm_Reading', 'Earth Resistance Tester (Ohm Reading Photo) *'),
                        ]
                        // STAGE 4: SOLAR & CIVIL
                        else if (widget.taskStage.contains('Stage 4') || widget.taskStage.contains('Solar')) ...[
                          _inputField('solar_panel_1', 'Solar Panel 1 Serial No *'),
                          _inputField('solar_panel_2', 'Solar Panel 2 Serial No *'),
                          _photoTile('Solar_Mounting_Structure', 'Solar Structure on Roof Photo *'),
                          _photoTile('Civil_Foundation_Pedestal', 'Civil Concrete Pedestal Photo *'),
                          _photoTile('Solar_Earthing_Lightning', 'Solar Earthing & Lightning Arrester Photo *'),
                        ]
                        // STAGE 5: INTEGRATION & SFPS
                        else if (widget.taskStage.contains('Stage 5') || widget.taskStage.contains('Integration')) ...[
                          _photoTile('Engineer_Selfie_Enclosure', 'Selfie with Installed Rack *'),
                          _inputField('sfp_1', 'SFP 1 Electrical Serial No *'),
                          _inputField('sfp_2', 'SFP 2 Optical (LR/ER) Serial No *'),
                          _inputField('sfp_3', 'SFP 3 Optical (LR/ER) Serial No *'),
                          _photoTile('Bypass_Filter_Patching', 'Bypass Filter Patching Photo *'),
                          _photoTile('Router_LED_Link_Ping', 'Router LED Link & Ping Verification Photo *'),
                        ]
                        // STAGE 6: FAT & HANDOVER
                        else ...[
                          _photoTile('Joint_Selfie_With_BSNL_Officer', 'Selfie with BSNL / IE Officer *'),
                          _photoTile('Smoke_Detector_Alarm_Test', 'Smoke Alarm Test Photo *'),
                          _photoTile('Water_Ingress_Sensor_Test', 'Water Ingress Sensor Photo *'),
                          _photoTile('Door_Intrusion_Switch_Test', 'Door Intrusion Switch Alarm Photo *'),
                          _photoTile('Noise_Meter_Ambient_Reading', 'Noise Meter Reading Photo *'),
                          _inputField('fat_cert_no', 'FAT Certificate Number *'),
                          _photoTile('Signed_WCC_Handover_Document', 'Signed WCC / Handover Document Photo *'),
                        ],

                        const SizedBox(height: 12),
                        TextField(controller: remarksCtrl, decoration: const InputDecoration(labelText: "Task Remarks / Site Note", border: OutlineInputBorder())),
                        const SizedBox(height: 20),
                        SizedBox(
                          height: 50,
                          child: ElevatedButton.icon(
                            onPressed: _submit,
                            icon: const Icon(Icons.cloud_upload),
                            label: const Text("SUBMIT STAGE WITH GPS STAMP", style: TextStyle(fontWeight: FontWeight.bold)),
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white),
                          ),
                        )
                      ],
                    ),
              );
            }

            Widget _inputField(String key, String label) {
              return Padding(
                padding: const EdgeInsets.only(bottom: 10),
                child: TextField(controller: _getCtrl(key), decoration: InputDecoration(labelText: label, border: const OutlineInputBorder())),
              );
            }

            Widget _photoTile(String tag, String title) {
              bool done = photos[tag] != null;
              return Card(
                margin: const EdgeInsets.only(bottom: 8),
                child: ListTile(
                  leading: Icon(done ? Icons.check_circle : Icons.camera_alt, color: done ? Colors.green : Colors.grey),
                  title: Text(title, style: const TextStyle(fontSize: 13, fontWeight: FontWeight.bold)),
                  trailing: ElevatedButton(
                    style: ElevatedButton.styleFrom(backgroundColor: done ? Colors.green : Colors.indigo, foregroundColor: Colors.white),
                    onPressed: () => _capture(tag),
                    child: Text(done ? "Retake" : "Capture", style: const TextStyle(fontSize: 11)),
                  ),
                ),
              );
            }
          }
          EOF

          # Build Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: HPL-Field-App-APK
          path: hpl_field_app/build/app/outputs/flutter-apk/app-release.apk
