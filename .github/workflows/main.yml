                        );
                      },
                    ),
                  ),
                  Container(
                    padding: const EdgeInsets.all(8),
                    color: Colors.white,
                    child: Row(
                      children: [
                        Expanded(child: TextField(controller: chatCtrl, decoration: const InputDecoration(hintText: "Type site issue / team update...", border: InputBorder.none))),
                        IconButton(icon: const Icon(Icons.send, color: Colors.indigo), onPressed: _sendChat),
                      ],
