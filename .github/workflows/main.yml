            Widget _buildSalarySlipsView() {
              return FutureBuilder(
                future: http.get(Uri.parse("$BASE_URL/field_app_api.php?action=get_salary_slips&user_id=${widget.userId}")),
                builder: (ctx, snap) {
                  if (snap.connectionState == ConnectionState.waiting) {
                    return const Center(child: CircularProgressIndicator());
                  }
                  if (!snap.hasData || snap.data?.statusCode != 200) {
                    return const Center(child: Text("No Salary Slips Available Yet"));
                  }
                  try {
                    var j = jsonDecode(snap.data!.body);
                    List slips = j['slips'] ?? [];
                    if (slips.isEmpty) {
                      return const Center(child: Text("No salary slips generated for your ID yet."));
                    }
                    return ListView.builder(
                      padding: const EdgeInsets.all(16),
                      itemCount: slips.length,
                      itemBuilder: (c, idx) {
