name: Build Release APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build HPL Pro Field App APK
        run: |
          set -e
          flutter create --org com.hplinfra hpl_field_app
          cd hpl_field_app

          flutter pub add http geolocator image_picker shared_preferences intl

          # Disable lint checks that cause build failures on release builds
          echo "android.lint.abortOnError=false" >> android/gradle.properties
          echo "android.lint.checkReleaseBuilds=false" >> android/gradle.properties

          if [ -f android/app/build.gradle.kts ]; then
            cat << 'EOF_LINT' >> android/app/build.gradle.kts

          android {
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
          EOF_LINT
          elif [ -f android/app/build.gradle ]; then
            cat << 'EOF_LINT' >> android/app/build.gradle

          android {
              lintOptions {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF_LINT
          fi

          cat << 'EOF_MANIFEST' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.CAMERA"/>

              <application
                  android:label="HPL FIELD TEAM"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF_MANIFEST

          cat << 'EOF_DART' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:http/http.dart' as http;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:intl/intl.dart';

          const String BASE_URL = "https://hplinfra.com/erp/api";

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: AppRoot()));
          }

          class AppRoot extends StatefulWidget {
            const AppRoot({super.key});
            @override
            State<AppRoot> createState() => _AppRootState();
          }

          class _AppRootState extends State<AppRoot> {
            bool isLoggedIn = false;
            int userId = 1;
            String userName = "Field Engineer";

            @override
            void initState() {
              super.initState();
              _checkAuth();
            }

            void _checkAuth() async {
              SharedPreferences p = await SharedPreferences.getInstance();
              setState(() {
                isLoggedIn = p.getBool('logged_in') ?? false;
                userId = p.getInt('user_id') ?? 1;
                userName = p.getString('user_name') ?? "Field Engineer";
              });
            }

            @override
            Widget build(BuildContext context) {
              return isLoggedIn 
                ? ProDashboard(userId: userId, userName: userName, onLogout: () {
                    setState(() => isLoggedIn = false);
                  })
                : LoginScreen(onLoginSuccess: (id, name) {
                    setState(() {
                      userId = id;
                      userName = name;
                      isLoggedIn = true;
                    });
                  });
            }
          }

          class LoginScreen extends StatefulWidget {
            final Function(int, String) onLoginSuccess;
            const LoginScreen({super.key, required this.onLoginSuccess});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final emailCtrl = TextEditingController(text: "admin@erp.com");
            final passCtrl = TextEditingController(text: "admin123");
            bool loading = false;

            void login() async {
              setState(() => loading = true);
              try {
                var res = await http.post(
                  Uri.parse("$BASE_URL/app_sync.php?action=login"),
                  body: {'email': emailCtrl.text.trim(), 'password': passCtrl.text},
                );
                var j = jsonDecode(res.body);
                if (j['status'] == true) {
                  SharedPreferences p = await SharedPreferences.getInstance();
                  await p.setBool('logged_in', true);
                  await p.setInt('user_id', j['user']['id']);
                  await p.setString('user_name', j['user']['name']);
                  widget.onLoginSuccess(j['user']['id'], j['user']['name']);
                } else {
                  ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(j['message'] ?? "Login Failed!")));
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text("Error: $e")));
              }
              setState(() => loading = false);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Card(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                      child: Padding(
                        padding: const EdgeInsets.all(24),
                        child: Column(
                          children: [
                            const Icon(Icons.engineering, size: 55, color: Colors.indigo),
                            const SizedBox(height: 10),
                            const Text("HPL FIELD TEAM", style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold, letterSpacing: 1.1)),
                            const Text("Enterprise Telecom Rollout", style: TextStyle(fontSize: 12, color: Colors.grey)),
                            const SizedBox(height: 20),
                            TextField(controller: emailCtrl, decoration: const InputDecoration(labelText: "Email ID", border: OutlineInputBorder())),
                            const SizedBox(height: 12),
                            TextField(controller: passCtrl, obscureText: true, decoration: const InputDecoration(labelText: "Password", border: OutlineInputBorder())),
                            const SizedBox(height: 20),
                            SizedBox(
                              width: double.infinity,
                              height: 48,
                              child: ElevatedButton(
                                onPressed: loading ? null : login,
                                style: ElevatedButton.styleFrom(backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                                child: loading ? const CircularProgressIndicator(color: Colors.white) : const Text("SIGN IN TO WORK"),
                              ),
                            )
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class ProDashboard extends StatefulWidget {
            final int userId;
            final String userName;
            final VoidCallback onLogout;
            const ProDashboard({super.key, required this.userId, required this.userName, required this.onLogout});
            @override
            State<ProDashboard> createState() => _ProDashboardState();
          }

          class _ProDashboardState extends State<ProDashboard> {
            int currentTab = 0;
            Position? currentGps;
            Position? lastRecordedGps;
            double totalDistanceMeters = 0.0;
            bool isPunchedIn = false;
            bool isDayCompleted = false;
            List<dynamic> myTasks = [];
            List<dynamic> filteredTasks = [];
            String selectedFilter = "All";
            List<dynamic> chatMessages = [];
            final chatCtrl = TextEditingController();
            StreamSubscription<Position>? gpsStreamSub;
            Timer? periodicBackupTimer;
            int presentDays = 0, absentDays = 0, leavesCount = 0;

            @override
            void initState() {
              super.initState();
              _initLocationTracking();
              _checkPersistentAttendance();
              _fetchTasks();
              _fetchRealAttendance();
              _fetchChat();
            }

            @override
            void dispose() {
              gpsStreamSub?.cancel();
              periodicBackupTimer?.cancel();
              super.dispose();
            }

            void _initLocationTracking() async {
              LocationPermission perm = await Geolocator.checkPermission();
              if (perm == LocationPermission.denied) {
                perm = await Geolocator.requestPermission();
              }

              try {
                Position p = await Geolocator.getCurrentPosition(
                  locationSettings: const LocationSettings(accuracy: LocationAccuracy.high)
                );
                setState(() {
                  currentGps = p;
                  lastRecordedGps ??= p;
                });
              } catch (_) {}

              const settings = LocationSettings(
                accuracy: LocationAccuracy.high,
                distanceFilter: 8,
              );

              gpsStreamSub?.cancel();
              gpsStreamSub = Geolocator.getPositionStream(locationSettings: settings).listen((Position pos) {
                _onNewLocationSample(pos);
              });

              periodicBackupTimer?.cancel();
              periodicBackupTimer = Timer.periodic(const Duration(seconds: 30), (t) async {
                if (!isPunchedIn) return;
                try {
                  Position pos = await Geolocator.getCurrentPosition(
                    locationSettings: const LocationSettings(accuracy: LocationAccuracy.high)
                  );
                  _onNewLocationSample(pos);
                } catch (_) {}
              });
            }

            void _onNewLocationSample(Position newPos) async {
              if (!mounted) return;
              setState(() => currentGps = newPos);

              if (!isPunchedIn) return;

              double delta = 0.0;
              if (lastRecordedGps != null) {
                delta = Geolocator.distanceBetween(
                  lastRecordedGps!.latitude,
                  lastRecordedGps!.longitude,
                  newPos.latitude,
                  newPos.longitude,
                );
              }

              // Only accumulate if moved >= 8 meters (accrues outward + return trip accurately)
              if (lastRecordedGps == null || delta >= 8.0) {
                setState(() {
                  if (lastRecordedGps != null) {
                    totalDistanceMeters += delta;
                  }
                  lastRecordedGps = newPos;
                });

                SharedPreferences p = await SharedPreferences.getInstance();
                await p.setDouble('total_distance_meters', totalDistanceMeters);

                List<String> route = p.getStringList('gps_route') ?? [];
                route.add(jsonEncode({
                  'lat': newPos.latitude,
                  'lng': newPos.longitude,
                  'time': DateFormat('HH:mm:ss').format(DateTime.now()),
                  'cumulative_m': totalDistanceMeters.round()
                }));
                await p.setStringList('gps_route', route);

                if (route.length >= 4) {
                  _syncRoutePointsToServer(route);
                }
              }
            }

            void _syncRoutePointsToServer(List<String> route) async {
              try {
                var pts = route.map((e) => jsonDecode(e)).toList();
                var res = await http.post(
                  Uri.parse("$BASE_URL/field_app_api.php?action=sync_offline_route"),
                  headers: {"Content-Type": "application/json"},
                  body: jsonEncode({
                    'user_id': widget.userId,
                    'total_distance_meters': totalDistanceMeters.round(),
                    'route_points': pts
                  }),
                );
                if (res.statusCode == 200) {
                  SharedPreferences p = await SharedPreferences.getInstance();
                  await p.remove('gps_route');
                }
              } catch (_) {}
            }

            void _checkPersistentAttendance() async {
              SharedPreferences p = await SharedPreferences.getInstance();
              String today = DateFormat('yyyy-MM-dd').format(DateTime.now());
              
              if (p.getString('punch_date') == today) {
                setState(() {
                  isPunchedIn = p.getBool('punched_in') ?? false;
                  totalDistanceMeters = p.getDouble('total_distance_meters') ?? 0.0;
                });
              } else {
                await p.setString('punch_date', today);
                await p.setDouble('total_distance_meters', 0.0);
                await p.remove('gps_route');
                setState(() => totalDistanceMeters = 0.0);
              }

              try {
                var res = await http.get(Uri.parse("$BASE_URL/field_app_api.php?action=get_today_status&user_id=${widget.userId}"));
                var j = jsonDecode(res.body);
                if (j['status'] == true) {
                  setState(() {
                    isPunchedIn = j['is_punched_in'];
                    isDayCompleted = j['is_completed'];
                  });
                  await p.setBool('punched_in', isPunchedIn);
                }
              } catch (_) {}
            }

            void _punchInWithSelfie() async {
              final picker = ImagePicker();
              final picked = await picker.pickImage(source: ImageSource.camera, preferredCameraDevice: CameraDevice.front);
              if (picked == null) return;

              Position pos = await Geolocator.getCurrentPosition(locationSettings: const LocationSettings(accuracy: LocationAccuracy.high));
              var req = http.MultipartRequest("POST", Uri.parse("$BASE_URL/field_app_api.php?action=punch_in"));
              req.fields['user_id'] = widget.userId.toString();
              req.fields['user_name'] = widget.userName;
              req.fields['latitude'] = pos.latitude.toString();
              req.fields['longitude'] = pos.longitude.toString();
              req.files.add(await http.MultipartFile.fromPath('selfie', picked.path));

              var res = await req.send();
              if (res.statusCode == 200) {
                SharedPreferences p = await SharedPreferences.getInstance();
                await p.setBool('punched_in', true);
                await p.setString('punch_date', DateFormat('yyyy-MM-dd').format(DateTime.now()));
                setState(() {
                  isPunchedIn = true;
                  lastRecordedGps = pos;
                });
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text("✓ Punch-In Done with Selfie! Route Tracking Active."), backgroundColor: Colors.green));
              }
            }

            // PUNCH-OUT WITH MANDATORY VERIFICATION SELFIE
            void _punchOutWithSelfie() async {
              final picker = ImagePicker();
              final picked = await picker.pickImage(source: ImageSource.camera, preferredCameraDevice: CameraDevice.front);
              if (picked == null) return;

              Position pos = await Geolocator.getCurrentPosition(locationSettings: const LocationSettings(accuracy: LocationAccuracy.high));
              var req = http.MultipartRequest("POST", Uri.parse("$BASE_URL/field_app_api.php?action=punch_out"));
              req.fields['user_id'] = widget.userId.toString();
              req.fields['latitude'] = pos.latitude.toString();
              req.fields['longitude'] = pos.longitude.toString();
              req.fields['total_distance_meters'] = totalDistanceMeters.toStringAsFixed(1);
              req.files.add(await http.MultipartFile.fromPath('selfie', picked.path));

              var res = await req.send();
              if (res.statusCode == 200) {
                SharedPreferences p = await SharedPreferences.getInstance();
                await p.setBool('punched_in', false);
                setState(() {
                  isPunchedIn = false;
                  isDayCompleted = true;
                });
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(
                  content: Text("✓ Duty Ended with Selfie! Total Distance: ${_formatDistance(totalDistanceMeters)}"),
                  backgroundColor: Colors.blue,
                ));
              }
            }

            String _formatDistance(double meters) {
              if (meters < 1000) {
                return "${meters.toStringAsFixed(0)} m";
              } else {
                return "${(meters / 1000).toStringAsFixed(2)} km (${meters.toStringAsFixed(0)} m)";
              }
            }

            void _fetchTasks() async {
              try {
                var res = await http.get(Uri.parse("$BASE_URL/field_app_api.php?action=get_my_tasks&user_id=${widget.userId}"));
                var j = jsonDecode(res.body);
                if (j['status'] == true) {
                  setState(() {
                    myTasks = j['tasks'];
                    _applyTaskFilter("All");
                  });
                }
              } catch (_) {}
            }

            void _applyTaskFilter(String stg) {
              setState(() {
                selectedFilter = stg;
                if (stg == "All") {
                  filteredTasks = myTasks;
                } else {
                  filteredTasks = myTasks.where((t) => (t['task_type'] ?? '').toString().contains(stg)).toList();
                }
              });
            }

            void _fetchRealAttendance() async {
              try {
                var res = await http.get(Uri.parse("$BASE_URL/field_app_api.php?action=get_monthly_attendance&user_id=${widget.userId}"));
                var j = jsonDecode(res.body);
                if (j['status'] == true) {
                  setState(() {
                    presentDays = j['present'];
                    absentDays = j['absent'];
                    leavesCount = j['leaves'];
                  });
                }
              } catch (_) {}
            }

            void _fetchChat() async {
              try {
                var res = await http.get(Uri.parse("$BASE_URL/field_app_api.php?action=get_chat_messages"));
                var j = jsonDecode(res.body);
                if (j['status'] == true) setState(() => chatMessages = j['messages']);
              } catch (_) {}
            }

            void _sendChat() async {
              if (chatCtrl.text.trim().isEmpty) return;
              var txt = chatCtrl.text.trim();
              chatCtrl.clear();
              await http.post(Uri.parse("$BASE_URL/field_app_api.php?action=send_chat_message"), body: {
                'sender_id': widget.userId.toString(),
                'sender_name': widget.userName,
                'message': txt,
              });
              _fetchChat();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF8FAFC),
                appBar: AppBar(
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(widget.userName, style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold)),
                      Text(
                        currentGps != null 
                          ? "GPS: ${currentGps!.latitude.toStringAsFixed(4)}, ${currentGps!.longitude.toStringAsFixed(4)} | Dist: ${_formatDistance(totalDistanceMeters)}"
                          : "Acquiring GPS...", 
                        style: const TextStyle(fontSize: 11, color: Colors.white70)
                      ),
                    ],
                  ),
                  backgroundColor: const Color(0xFF0F172A),
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.logout),
                      onPressed: () async {
                        SharedPreferences p = await SharedPreferences.getInstance();
                        await p.clear();
                        widget.onLogout();
                      },
                    )
                  ],
                ),
                body: IndexedStack(
                  index: currentTab,
                  children: [
                    _buildDutyTab(),
                    _buildTasksTab(),
                    _buildChatTab(),
                    _buildAttendanceTab(),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: currentTab,
                  onTap: (i) => setState(() => currentTab = i),
                  selectedItemColor: Colors.indigo,
                  unselectedItemColor: Colors.grey,
                  type: BottomNavigationBarType.fixed,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.camera_front), label: "Selfie Duty"),
                    BottomNavigationBarItem(icon: Icon(Icons.assignment), label: "My Tasks"),
                    BottomNavigationBarItem(icon: Icon(Icons.chat), label: "Team Chat"),
                    BottomNavigationBarItem(icon: Icon(Icons.calendar_month), label: "Attendance"),
                  ],
                ),
              );
            }

            Widget _buildDutyTab() {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  Card(
                    elevation: 2,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                    child: Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        children: [
                          Text(
                            isDayCompleted 
                              ? "TODAY'S DUTY COMPLETED ✓" 
                              : (isPunchedIn ? "DUTY ACTIVE (ON SITE)" : "DUTY NOT STARTED"),
                            style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: isPunchedIn ? Colors.green : (isDayCompleted ? Colors.blue : Colors.red)),
                          ),
                          const SizedBox(height: 12),
                          // Live Odometer Box (Forward + Return Distance)
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 10),
                            decoration: BoxDecoration(color: Colors.indigo.shade50, borderRadius: BorderRadius.circular(10), border: Border.all(color: Colors.indigo.shade200)),
                            child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                Row(
                                  children: [
                                    Icon(Icons.route, color: Colors.indigo.shade700, size: 28),
                                    const SizedBox(width: 10),
                                    Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        const Text("Cumulative Distance Travelled", style: TextStyle(fontSize: 11, color: Colors.black54)),
                                        Text(_formatDistance(totalDistanceMeters), style: TextStyle(fontSize: 17, fontWeight: FontWeight.bold, color: Colors.indigo.shade900)),
                                      ],
                                    ),
                                  ],
                                ),
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                                  decoration: BoxDecoration(color: isPunchedIn ? Colors.green.shade100 : Colors.grey.shade200, borderRadius: BorderRadius.circular(6)),
                                  child: Text(isPunchedIn ? "Live Tracking" : "Stopped", style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: isPunchedIn ? Colors.green.shade800 : Colors.black54)),
                                )
                              ],
                            ),
                          ),
                          const SizedBox(height: 16),
                          if (!isDayCompleted)
                            SizedBox(
                              width: double.infinity,
                              height: 52,
                              child: ElevatedButton.icon(
                                onPressed: isPunchedIn ? _punchOutWithSelfie : _punchInWithSelfie,
                                icon: Icon(isPunchedIn ? Icons.camera_front : Icons.camera_alt),
                                label: Text(isPunchedIn ? "PUNCH OUT (TAKE SELFIE & END DUTY)" : "PUNCH IN (TAKE SELFIE)"),
                                style: ElevatedButton.styleFrom(backgroundColor: isPunchedIn ? Colors.red : Colors.green, foregroundColor: Colors.white),
                              ),
                            ),
                          const SizedBox(height: 8),
                          const Text("Both Punch-In & Punch-Out require a live verification selfie.", style: TextStyle(fontSize: 10, color: Colors.grey)),
                        ],
                      ),
                    ),
                  ),
                ],
              );
            }

            Widget _buildTasksTab() {
              return Column(
                children: [
                  Container(
                    height: 50,
                    padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),
                    color: Colors.white,
                    child: ListView(
                      scrollDirection: Axis.horizontal,
                      children: ["All", "Stage 1", "Stage 2", "Stage 3", "Stage 4", "Stage 5", "Stage 6"].map((stg) {
                        bool sel = selectedFilter == stg;
                        return Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 4),
                          child: ChoiceChip(
                            label: Text(stg, style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold, color: sel ? Colors.white : Colors.black87)),
                            selected: sel,
                            selectedColor: Colors.indigo,
                            onSelected: (b) => _applyTaskFilter(stg),
                          ),
                        );
                      }).toList(),
                    ),
                  ),
                  Expanded(
                    child: filteredTasks.isEmpty
                      ? const Center(child: Text("No tasks assigned under this stage."))
                      : ListView.builder(
                          padding: const EdgeInsets.all(12),
                          itemCount: filteredTasks.length,
                          itemBuilder: (ctx, i) {
                            var t = filteredTasks[i];
                            return Card(
                              elevation: 2,
                              margin: const EdgeInsets.only(bottom: 12),
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                              child: Padding(
                                padding: const EdgeInsets.all(14),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3),
                                      decoration: BoxDecoration(color: Colors.indigo.shade50, borderRadius: BorderRadius.circular(6), border: Border.all(color: Colors.indigo.shade200)),
                                      child: Text(t['task_type'] ?? 'Execution Stage', style: const TextStyle(fontSize: 11, fontWeight: FontWeight.bold, color: Colors.indigo)),
                                    ),
                                    const SizedBox(height: 6),
                                    Text(t['gp_name'] ?? 'GP Site', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                                    Text("${t['district_name']} • ${t['block_name']} (${t['gp_code']}) • Target: ${t['target_date']}", style: const TextStyle(fontSize: 12, color: Colors.black54)),
                                    const SizedBox(height: 10),
                                    SizedBox(
                                      width: double.infinity,
                                      child: ElevatedButton.icon(
                                        style: ElevatedButton.styleFrom(backgroundColor: Colors.indigo, foregroundColor: Colors.white),
                                        onPressed: () {
                                          Navigator.push(context, MaterialPageRoute(builder: (c) => StageExecutionScreen(
                                            taskId: int.tryParse(t['task_id']?.toString() ?? '0') ?? 0,
                                            gpId: int.tryParse(t['gp_id']?.toString() ?? '0') ?? 0,
                                            gpName: t['gp_name'] ?? 'Site',
                                            taskStage: t['task_type'] ?? 'Stage 1',
                                            userName: widget.userName,
                                          )));
                                        },
                                        icon: const Icon(Icons.camera_alt, size: 16),
                                        label: const Text("Open Stage Execution Form", style: TextStyle(fontSize: 13, fontWeight: FontWeight.bold)),
                                      ),
                                    ),
                                  ],
                                ),
                              ),
                            );
                          },
                        ),
                  ),
                ],
              );
            }

            Widget _buildChatTab() {
              return Column(
                children: [
                  Expanded(
                    child: ListView.builder(
                      padding: const EdgeInsets.all(12),
                      itemCount: chatMessages.length,
                      itemBuilder: (ctx, i) {
                        var m = chatMessages[i];
                        bool isMe = m['sender_id'].toString() == widget.userId.toString();
                        return Align(
                          alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                          child: Container(
                            margin: const EdgeInsets.only(bottom: 8),
                            padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                            decoration: BoxDecoration(
                              color: isMe ? Colors.indigo : Colors.white,
                              borderRadius: BorderRadius.circular(10),
                              boxShadow: const [BoxShadow(color: Colors.black12, blurRadius: 2)],
                            ),
                            child: Column(
                              crossAxisAlignment: isMe ? CrossAxisAlignment.end : CrossAxisAlignment.start,
                              children: [
                                Text(m['sender_name'] ?? 'User', style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: isMe ? Colors.white70 : Colors.indigo)),
                                Text(m['message'] ?? '', style: TextStyle(color: isMe ? Colors.white : Colors.black87, fontSize: 13)),
                              ],
                            ),
